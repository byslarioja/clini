name: Tests

on:
  pull_request:
    branches: [develop, main]
  # Pushes to the long-lived branches keep the README badges reporting
  push:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_backend:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clone repo
        uses: actions/checkout@v7

      - name: ⚙️ PHP + composer
        uses: ./.github/actions/setup-php

      - name: ⚡ Setup Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml pins the test connection to in-memory sqlite, so no MySQL
      # service is needed. `php artisan test` runs the suite regardless of the
      # underlying framework (PHPUnit today).
      - name: 🧪 Tests
        run: php artisan test
